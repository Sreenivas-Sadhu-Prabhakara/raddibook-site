<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="RaddiBook — weigh it, pay it, know your margin. A KARYA studio build.">
  <title>RaddiBook — weigh it, pay it, know your margin</title>

  <!-- kraft paper base -->
  <rect width="1200" height="630" fill="#F7F1E8"/>

  <!-- faint ledger rules -->
  <g stroke="#E4D8C4" stroke-width="2">
    <line x1="0" y1="150" x2="1200" y2="150"/>
    <line x1="0" y1="230" x2="1200" y2="230"/>
    <line x1="0" y1="310" x2="1200" y2="310"/>
    <line x1="0" y1="390" x2="1200" y2="390"/>
    <line x1="0" y1="470" x2="1200" y2="470"/>
  </g>

  <!-- amber accent band down the left, like a ledger margin -->
  <rect x="0" y="0" width="18" height="630" fill="#b45309"/>
  <rect x="90" y="0" width="2" height="630" fill="#EBDDC7"/>

  <!-- logo mark -->
  <g transform="translate(96,74)">
    <rect x="0" y="0" width="72" height="66" rx="8" fill="#b45309"/>
    <rect x="0" y="0" width="19" height="66" rx="8" fill="#8a3f06"/>
    <path d="M32 22h30M32 36h30M32 50h20" stroke="#F7F1E8" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- brand name -->
  <text x="188" y="127" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="46" font-weight="800" letter-spacing="-1">
    <tspan fill="#241A11">Raddi</tspan><tspan fill="#b45309">Book</tspan>
  </text>

  <!-- headline -->
  <text x="96" y="300" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="90" font-weight="800" letter-spacing="-3" fill="#241A11">Weigh it. Pay it.</text>
  <text x="96" y="408" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="90" font-weight="800" letter-spacing="-3" fill="#b45309">Know your margin.</text>

  <!-- tagline -->
  <text x="98" y="482" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="31" font-weight="500" fill="#57493B">Scrap buying by weight × rate, stock by category &amp; resale margin — a book for the kabadiwala.</text>

  <!-- footer row: KARYA wordmark + subscription note -->
  <g transform="translate(96,556)">
    <rect x="0" y="-26" width="150" height="42" rx="21" fill="#b45309"/>
    <text x="75" y="2" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="800" letter-spacing="3" fill="#F7F1E8">KARYA</text>
    <text x="172" y="1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="600" fill="#57493B">studio build · subscription · pricing on discovery</text>
  </g>

  <!-- mini payout-slip chip, top-right, echoing the product -->
  <g transform="translate(792,96)">
    <rect x="0" y="0" width="312" height="200" rx="16" fill="#FFFDF9" stroke="#D2C2A6" stroke-width="2"/>
    <text x="24" y="42" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="18" font-weight="700" fill="#241A11">Payout slip</text>
    <rect x="216" y="24" width="76" height="26" rx="13" fill="#EBDDC7"/>
    <text x="254" y="42" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" fill="#8a3f06">Paid</text>

    <text x="24" y="92" font-family="-apple-system, sans-serif" font-size="17" fill="#57493B">Paper · 14 kg × ₹14</text>
    <text x="288" y="92" text-anchor="end" font-family="'SF Mono', Menlo, monospace" font-size="16" font-weight="700" fill="#241A11">₹196</text>

    <text x="24" y="126" font-family="-apple-system, sans-serif" font-size="17" fill="#57493B">Iron · 8.5 kg × ₹32</text>
    <text x="288" y="126" text-anchor="end" font-family="'SF Mono', Menlo, monospace" font-size="16" font-weight="700" fill="#241A11">₹272</text>

    <line x1="24" y1="150" x2="288" y2="150" stroke="#E4D8C4" stroke-width="2"/>
    <text x="24" y="182" font-family="-apple-system, sans-serif" font-size="14" fill="#57493B">Cash to pay</text>
    <text x="288" y="182" text-anchor="end" font-family="'SF Mono', Menlo, monospace" font-size="18" font-weight="800" fill="#b45309">₹534</text>
  </g>
</svg>
